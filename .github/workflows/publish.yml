name: Publish Packages & Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to current tag or v<package.json version>)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry-run npm publish and skip creating GitHub/CNB releases"
        type: boolean
        required: false
        default: false
      skip_desktop:
        description: "Skip 3-OS Electron desktop installer builds"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify lockstep versions and tag alignment
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG=""
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if [ -n "$TAG" ]; then
            bun run version:check --tag "$TAG"
          else
            bun run version:check
          fi
          bun run version:show --shell >> "$GITHUB_OUTPUT"

      - name: Build packages and standalone skill
        run: |
          bun run build:packages
          bun run build:skill

      - name: Typecheck and test packages & release tooling
        run: |
          bun run typecheck:core
          bun run typecheck:editor
          bun run typecheck:agent
          bun run test:core
          bun run test:editor
          bun run test:agent
          bun run test:release

      - name: Configure public npmjs.org registry authentication
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret is required for live npm publish" >&2
            exit 1
          fi
          cat <<EOF > .npmrc
          @moesekai:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF

      - name: Publish @moesekai packages in topological order
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bun run publish:packages --dry-run --skip-build
          else
            bun run publish:packages --skip-build
          fi

  build-desktop:
    needs: publish-npm
    if: ${{ inputs.skip_desktop != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build packages and skill
        run: |
          bun run build:packages
          bun run build:skill

      - name: Build & package desktop installers (${{ matrix.platform }})
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          bun run build
          if [ "$TARGET_PLATFORM" = "linux" ]; then
            bunx electron-builder --config electron-builder.yml -c.linux.executableName=moesekai-story-studio --publish never
          else
            bunx electron-builder --config electron-builder.yml --publish never
          fi

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p release-upload
          shopt -s nullglob
          for f in apps/desktop/release/*.exe apps/desktop/release/*.dmg apps/desktop/release/*.AppImage apps/desktop/release/*.blockmap; do
            cp "$f" release-upload/
          done
          ls -lh release-upload/

      - name: Upload ${{ matrix.platform }} installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: release-upload/*
          if-no-files-found: error

  publish-releases:
    needs:
      - publish-npm
      - build-desktop
    if: ${{ always() && needs.publish-npm.result == 'success' && (needs.build-desktop.result == 'success' || inputs.skip_desktop == true) && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Download all 3-OS desktop installer artifacts
        if: ${{ inputs.skip_desktop != true }}
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS.txt and release notes
        shell: bash
        env:
          VERSION: ${{ needs.publish-npm.outputs.version }}
          TAG: ${{ needs.publish-npm.outputs.tag }}
        run: |
          mkdir -p release-assets
          if [ -n "$(ls -A release-assets 2>/dev/null)" ]; then
            (cd release-assets && sha256sum * > SHA256SUMS.txt)
            cat release-assets/SHA256SUMS.txt
          fi

          bun -e '
            import { existsSync, readFileSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            let notes = "";
            if (existsSync("CHANGELOG.md")) {
              const md = readFileSync("CHANGELOG.md", "utf8");
              const escaped = version.replace(/\./g, "\\.");
              const re = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|$)`, "m");
              const match = re.exec(md);
              if (match) notes = match[1].trim();
            }
            if (!notes) {
              notes = `MoeSekai Story Studio ${tag}\n\n- Published \`@moesekai/story-core@${version}\`, \`@moesekai/story-editor@${version}\`, and \`@moesekai/story-agent@${version}\` to npmjs.org.\n- Attached cross-platform Desktop installers and \`SHA256SUMS.txt\`.`;
            }
            writeFileSync("release-notes.md", `${notes}\n`, "utf8");
          '

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-npm.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MoeSekai Story Studio ${TAG}" --notes-file release-notes.md
            if [ -n "$(ls -A release-assets 2>/dev/null)" ]; then
              gh release upload "$TAG" release-assets/* --clobber
            fi
          else
            if [ -n "$(ls -A release-assets 2>/dev/null)" ]; then
              gh release create "$TAG" release-assets/* --title "MoeSekai Story Studio ${TAG}" --notes-file release-notes.md
            else
              gh release create "$TAG" --title "MoeSekai Story Studio ${TAG}" --notes-file release-notes.md
            fi
          fi

      - name: Mirror Release & installers to CNB (cnb.cool)
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ needs.publish-npm.outputs.tag }}
        run: |
          bun scripts/sync-cnb-release.ts \
            --repo "StarMoe-org/${{ github.event.repository.name }}" \
            --tag "$TAG" \
            --name "MoeSekai Story Studio ${TAG}" \
            --notes-file release-notes.md \
            --assets-dir release-assets
